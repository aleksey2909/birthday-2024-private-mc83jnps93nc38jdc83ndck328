<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хэллоуинский Конкурс Костюмов 🎃</title>

    <style>
        body {
            background-color: #1a1a1a;
            color: #fa7921;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1, h2 { color: #e65c00; text-shadow: 2px 2px 4px #000; }
        .section {
            background: #262626;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #fa7921;
            box-shadow: 0 0 15px rgba(250, 121, 33, 0.3);
        }
        input, button {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #fa7921;
            font-size: 16px;
        }
        input { background: #333; color: #fff; }
        button {
            background: #fa7921;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #e65c00; box-shadow: 0 0 10px #fa7921; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #262626;
            border: 1px solid #fa7921;
            border-radius: 8px;
            width: 250px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 5px;
        }
        .votes-count {
            font-size: 18px;
            font-weight: bold;
            color: #00cc66;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<h1>🎃 Хэллоуинский Конкурс 👻</h1>

<!-- ЭКРАН ЗАГРУЗКИ -->
<div id="uploadSection" class="section">
    <h2>Шаг 1: Загрузи свой образ</h2>
    <input type="text" id="username" placeholder="Введи свое имя или ник" required>
    <input type="file" id="photo" accept="image/*" required>
    <button id="uploadBtn">Участвовать!</button>
    <p id="status" style="color: #fff;"></p>
</div>

<!-- ЭКРАН ОЖИДАНИЯ ДО ГОЛОСОВАНИЯ -->
<div id="waitSection" class="section" style="display:none;">
    <h2>Голосование будет доступно после 21:00</h2>
    <p style="color:#fff;">Ты уже загрузил свой костюм. Возвращайся после 21:00, чтобы проголосовать!</p>
</div>

<!-- ЭКРАН ГОЛОСОВАНИЯ -->
<div id="voteSection" style="display:none;">
    <h2>Шаг 2: Голосование за лучший костюм</h2>
    <div class="gallery" id="gallery"></div>
</div>

<script type="module">
    /* ---------- Firebase ---------- */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        getFirestore, collection, addDoc, onSnapshot,
        updateDoc, doc, increment, query, orderBy, where, getDocs
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import {
        getStorage, ref, uploadBytes, getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDkyFraWVn_Hp9tTZWGIKOeNFQKpAUzqSw",
        authDomain: "halloween-ab861.firebaseapp.com",
        projectId: "halloween-ab861",
        storageBucket: "halloween-ab861.appspot.com",
        messagingSenderId: "916753639549",
        appId: "1:916753639549:web:935dfb4a96af629625e914"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    /* ---------- IP ---------- */
    async function getUserIP() {
        try {
            const res = await fetch("https://api.ipify.org?format=json");
            const data = await res.json();
            return data.ip;
        } catch {
            return "unknown";
        }
    }

    /* ---------- ЛОГИКА ЭКРАНОВ ---------- */
    function updateScreenState() {
        const uploaded = localStorage.getItem("uploaded");
        const now = new Date();
        const hour = now.getHours();

        const uploadSection = document.getElementById("uploadSection");
        const waitSection = document.getElementById("waitSection");
        const voteSection = document.getElementById("voteSection");

        if (!uploaded) {
            uploadSection.style.display = "block";
            waitSection.style.display = "none";
            voteSection.style.display = "none";
            return;
        }

        uploadSection.style.display = "none";

        if (hour < 21) {
            waitSection.style.display = "block";
            voteSection.style.display = "none";
        } else {
            waitSection.style.display = "none";
            voteSection.style.display = "block";
        }
    }

    updateScreenState();

    /* ---------- ЗАГРУЗКА УЧАСТНИКА ---------- */
    document.getElementById("uploadBtn").onclick = async () => {
        const name = document.getElementById("username").value.trim();
        const file = document.getElementById("photo").files[0];
        const status = document.getElementById("status");
        const btn = document.getElementById("uploadBtn");

        if (!name || !file) {
            alert("Введите имя и выберите фото!");
            return;
        }

        // защита: 1 IP = 1 загрузка
        const userIP = await getUserIP();
        const uploadCheckQuery = query(collection(db, "participants"), where("ip", "==", userIP));
        const uploadCheckSnap = await getDocs(uploadCheckQuery);

        if (!uploadCheckSnap.empty) {
            alert("С этого IP уже загружено фото!");
            return;
        }

        // защита по устройству
        if (localStorage.getItem("uploaded")) {
            alert("Вы уже загрузили фото с этого устройства!");
            return;
        }

        btn.disabled = true;
        status.innerText = "🧙‍♂️ Загружаем фото...";

        try {
            const fileName = `${Date.now()}_${file.name}`;
            const storageRef = ref(storage, "photos/" + fileName);

            await uploadBytes(storageRef, file);
            const imageUrl = await getDownloadURL(storageRef);

            status.innerText = "🧛‍♂️ Фото загружено! Сохраняем...";

            await addDoc(collection(db, "participants"), {
                name,
                imageUrl,
                votes: 0,
                ip: userIP,
                createdAt: Date.now()
            });

            status.innerText = "🎃 Успех! Твой костюм в галерее.";
            document.getElementById("username").value = "";
            document.getElementById("photo").value = "";

            localStorage.setItem("uploaded", "true");
            updateScreenState();
        } catch (err) {
            console.error(err);
            status.innerText = "❌ Ошибка загрузки.";
        }

        btn.disabled = false;
    };

    /* ---------- ГАЛЕРЕЯ ---------- */
    const gallery = document.getElementById("gallery");
    const participantsQuery = query(collection(db, "participants"), orderBy("votes", "desc"));

    onSnapshot(participantsQuery, (snapshot) => {
        gallery.innerHTML = "";
        const hasVoted = localStorage.getItem("halloween_voted");

        snapshot.forEach((docSnap) => {
            const p = docSnap.data();
            const id = docSnap.id;

            const card = document.createElement("div");
            card.className = "card";

            const action = hasVoted
                ? `<div class="votes-count">💀 Голосов: ${p.votes}</div>`
                : `<button onclick="vote('${id}')">🎃 Проголосовать</button>`;

            card.innerHTML = `
                <img src="${p.imageUrl}">
                <h3>${p.name}</h3>
                ${action}
            `;

            gallery.appendChild(card);
        });
    });

    /* ---------- ГОЛОСОВАНИЕ ---------- */
    window.vote = async (id) => {
        // защита по устройству
        if (localStorage.getItem("halloween_voted")) {
            alert("Вы уже голосовали с этого устройства!");
            return;
        }

        const userIP = await getUserIP();

        // защита: 1 IP = 1 голос
        const voteCheckQuery = query(collection(db, "votes"), where("ip", "==", userIP));
        const voteCheckSnap = await getDocs(voteCheckQuery);

        if (!voteCheckSnap.empty) {
            alert("С этого IP уже голосовали!");
            return;
        }

        try {
            const refDoc = doc(db, "participants", id);
            await updateDoc(refDoc, { votes: increment(1) });

            await addDoc(collection(db, "votes"), {
                ip: userIP,
                votedFor: id,
                time: Date.now()
            });

            localStorage.setItem("halloween_voted", "true");
            updateScreenState();
        } catch (err) {
            console.error(err);
            alert("Ошибка голосования.");
        }
    };
</script>

</body>
</html>
